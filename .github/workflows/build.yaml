name: build and deploy backend
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/build.yaml'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Authenticate to GCP (OIDC)
    uses: google-github-actions/auth@v2
    with:
      workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  - name: Set up Google Cloud
    uses: google-github-actions/setup-gcloud@v2
    with:
      project_id: ${{ secrets.GCP_PROJECT_ID }}

  - name: Configure Docker
    run: |
      gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

  - name: Build Docker Image
    run: |
      docker build \
        -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend/prwise:${{ github.sha }} \
        ./backend

  - name: Push Docker Image
    run: |
      docker push \
        asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend/prwise:${{ github.sha }}

  - name: Deploy to Cloud Run
    run: |
      gcloud run deploy prwise \
        --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend/prwise:${{ github.sha }} \
        --region asia-south1 \
        --allow-unauthenticated \
        --quiet