name: build and deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/build.yaml"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: |
          cd backend
          pnpm install

      # -------------------------
      # GCP AUTH
      # -------------------------
      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set project explicitly
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      # -------------------------
      # FIX: Docker credential store conflict
      # -------------------------
      - name: Fix Docker auth (IMPORTANT)
        run: |
          mkdir -p ~/.docker
          cat > ~/.docker/config.json <<EOF
          {
            "credHelpers": {
              "asia-south1-docker.pkg.dev": "gcloud"
            }
          }
          EOF

      - name: Configure Docker with gcloud
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # -------------------------
      # DEBUG (safe to keep)
      # -------------------------
      - name: Debug identity
        run: |
          gcloud auth list
          gcloud config list

      - name: Debug docker config
        run: cat ~/.docker/config.json

      # -------------------------
      # PRISMA MIGRATIONS
      # -------------------------
      - name: Run Prisma migrations
        run: |
          cd backend
          pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # -------------------------
      # BUILD
      # -------------------------
      - name: Build Docker Image
        run: |
          cd backend
          docker build \
            -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend/prwise:${{ github.sha }} \
            .

      # -------------------------
      # PUSH
      # -------------------------
      - name: Push Docker Image
        run: |
          docker push \
            asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend/prwise:${{ github.sha }}

      # -------------------------
      # DEPLOY
      # -------------------------
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy prwise \
            --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend/prwise:${{ github.sha }} \
            --region asia-south1 \
            --allow-unauthenticated \
            --quiet
